# Accounting daemon for the local lab container.
# Test-fixture credentials only — the database listens on the container's
# loopback and is destroyed with the container.
AuthType=auth/munge
DbdHost=hpclab
DbdPort=6819
SlurmUser=slurm
DebugLevel=info
LogFile=/var/log/slurm/slurmdbd.log
PidFile=/run/slurmdbd.pid

StorageType=accounting_storage/mysql
StorageHost=localhost
StoragePort=3306
StorageUser=slurm
StoragePass=slurmlabpass
StorageLoc=slurm_acct_db
