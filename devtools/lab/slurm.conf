# Single-node Slurm for the local HPC lab container.
# The container hostname is fixed to `hpclab` so SlurmctldHost and NodeName
# resolve without DNS.
ClusterName=hpclab
SlurmctldHost=hpclab

SlurmUser=slurm
SlurmdUser=root
StateSaveLocation=/var/spool/slurmctld
SlurmdSpoolDir=/var/spool/slurmd
SlurmctldPidFile=/run/slurmctld.pid
SlurmdPidFile=/run/slurmd.pid

# No cgroup hierarchy inside the container, so track by plain process tree.
ProctrackType=proctrack/linuxproc
TaskPlugin=task/none

SchedulerType=sched/backfill
SelectType=select/cons_tres
SelectTypeParameters=CR_CPU
ReturnToService=2

# Accounting via slurmdbd so `sacct` answers for finished jobs — the client
# looks up a job's final state there once it leaves `squeue`.
AccountingStorageType=accounting_storage/slurmdbd
AccountingStorageHost=hpclab
JobAcctGatherType=jobacct_gather/linux
JobAcctGatherFrequency=10

SlurmctldLogFile=/var/log/slurm/slurmctld.log
SlurmdLogFile=/var/log/slurm/slurmd.log
SlurmctldDebug=info
SlurmdDebug=info

# Short timeouts keep lifecycle tests fast.
SlurmctldTimeout=30
SlurmdTimeout=30
MessageTimeout=10
MinJobAge=300
KillWait=5

# Hardware is auto-detected from the container so a mismatch with the
# host CPU topology cannot put the node into an invalid config state.
NodeName=hpclab State=UNKNOWN
PartitionName=debug Nodes=ALL Default=YES MaxTime=INFINITE State=UP
PartitionName=short Nodes=ALL Default=NO MaxTime=00:10:00 State=UP
