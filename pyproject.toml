[project]
name = "hpc-client-gui"
version = "1.5.6"
requires-python = "==3.14.*"
dependencies = [
    "PySide6>=6.5",
    "paramiko>=3.4",
    "cryptography>=41.0",
    "packaging>=23",
    "keyring>=25.0",
]

authors = [{ name = "Mehmed Sinan KÖMEK" }]
license = { text = "PolyForm Noncommercial License 1.0.0" }

[project.optional-dependencies]
test = ["pyftpdlib>=1.5.9", "pytest>=7"]
dev = ["ruff>=0.4", "pytest-cov>=5", "pip-audit>=2.7", "build>=1.2"]

[tool.pytest.ini_options]
markers = [
    "packaging: builds and inspects a wheel (slow; run with -m packaging)",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Runtime assets only: GUI icons/flags, embedded terminal (xterm.js), docs
# shipped inside the app, and translations. Development files are excluded.
hpc_gui = [
    "assets/**/*.svg",
    "assets/**/*.png",
    "assets/**/*.js",
    "assets/**/*.css",
    "assets/**/*.html",
    "assets/**/*.md",
    "docs/*.md",
    "i18n/*.json",
]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
# Conservative, low-churn gate: syntax errors, pyflakes correctness
# (undefined/shadowed names, unused imports/variables) and basic statement
# style. Formatting rules and the wider E/W catalogue stay out on purpose.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Tests and scripts intentionally import after sys.path/env setup.
"tests/**" = ["E402"]
"scripts/**" = ["E402"]
# Platform-guarded modules keep their imports below conditional setup blocks.
"src/hpc_gui/core/debug_telemetry.py" = ["E402"]
"src/hpc_gui/core/logging.py" = ["E402"]
"src/hpc_gui/services/files_ssh.py" = ["E402"]
"src/hpc_gui/services/process_registry.py" = ["E402"]
"src/hpc_gui/services/putty_manager.py" = ["E402"]
"src/hpc_gui/services/windows_console.py" = ["E402"]
"src/hpc_gui/services/x11_system_ssh.py" = ["E402"]
