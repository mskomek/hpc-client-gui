name: V2 Jobs combined release preflight

on:
  pull_request:
    branches: [develop]
    paths:
      - ".github/workflows/v2-jobs-broad-preflight.yml"
      - "src/hpc_gui/jobs/**"
      - "src/hpc_gui/wx_jobs.py"
      - "src/hpc_gui/wx_shell_jobs*.py"
      - "scripts/release_test_suite.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v2-jobs-broad-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

# Host-only diagnostic gates. Never substitute for packaged Windows 11 and
# interactive Ubuntu VM acceptance, or real remote TRUBA behavior.
jobs:
  source-500-line-boundary:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'codex/jobs-workspace-recovery-merge'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Enforce source and script 500-physical-line rule
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          roots = [Path("src/hpc_gui"), Path("scripts")]
          paths = [p for root in roots for p in root.rglob("*.py") if p.is_file()]
          failures = [
              (str(p), len(p.read_text(encoding="utf-8").splitlines()))
              for p in paths
          ]
          failures = [(p, n) for p, n in failures if n > 500]
          print(f"Checked {len(paths)} source/script Python files; {len(failures)} exceed 500 lines")
          for name, lines in failures:
              print(f"OVER_500 {name}: {lines}")
          if failures:
              raise SystemExit(1)
          PY

  windows-full-release-preflight:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'codex/jobs-workspace-recovery-merge'
    runs-on: windows-latest
    timeout-minutes: 55
    env:
      PYTHONPATH: src
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Checkout exact combined tree
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python 3.14
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
      - name: Install pinned wx production and test dependencies
        run: |
          python -m pip install -r requirements-release.lock
          python -m pip install --no-deps -e .
      - name: Run complete source release preflight with isolated GUI test processes
        run: python scripts/release_test_suite.py
