name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  compat:
    name: Compatibility (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    env:
      PYTHONPATH: src
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Qt runtime
        run: sudo apt-get update && sudo apt-get install --yes libegl1
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -e .[test]
          pip install pytest
      - name: Compile check
        run: python -m compileall src/hpc_gui
      - name: i18n drift gate
        run: python scripts/check_i18n.py
      - name: Headless smoke tests
        run: >
          python -m pytest tests/test_cli.py tests/test_cli_entrypoint.py
          tests/test_config_storage_atomic.py tests/test_profile_identity.py
          tests/test_profile_transfer_settings.py tests/test_slurm_models.py
          tests/test_slurm_script_parser.py tests/test_remote_entry_helpers.py
          tests/test_upload_pipelining.py tests/test_version_consistency.py
          -q --tb=short -rf

  cli:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Qt runtime
        run: sudo apt-get update && sudo apt-get install --yes libegl1
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -e .[test]
          pip install pytest
      - name: Compile check
        run: python -m compileall src/hpc_gui
      - name: i18n drift gate
        run: python scripts/check_i18n.py
      - name: Smoke test
        run: python scripts/smoke_test.py
      - name: CLI test suite
        run: python -m pytest tests/test_cli.py tests/test_cli_entrypoint.py -q --tb=short -rf


  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Branding string gate
        run: python scripts/check_branding.py
      - name: Release surface gate
        run: python scripts/check_release_surface.py
      - name: Wiki source gate
        run: |
          if [ -d docs/wiki ]; then
            python scripts/check_wiki.py
          else
            echo "wiki check: SKIPPED (docs/wiki is outside the main sync boundary)"
          fi

  ssh_sftp:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Qt runtime
        run: sudo apt-get update && sudo apt-get install --yes libegl1
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -e .[test]
          pip install pytest
      - name: SSH and SFTP test suite
        run: python -m pytest tests/test_optional_ssh_credentials.py tests/test_slurm_ssh.py tests/test_local_transfer_gate.py tests/test_transfer_wave17.py tests/test_transfer_controller.py tests/test_profile_transfer_settings.py -q --tb=short -rf

  windows:
    runs-on: windows-latest
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -e .[test]
          pip install pytest
      - name: Windows boundary tests
        run: python -m pytest tests/test_safe_download.py tests/test_version_consistency.py tests/test_startup_changelog.py -q --tb=short
      - name: Terminal transport tests
        run: |
          python -m unittest discover -s tests -p "test_terminal_*.py"
          python -m unittest discover -s tests -p "test_ssh_terminal_stream.py"
  lint:
    name: Lint (Ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Ruff
        run: pip install "ruff>=0.4"
      - name: Ruff check (E4/E7/E9/F)
        run: ruff check src scripts tests

  dependency_audit:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install runtime dependency closure in an isolated environment
        run: |
          python -m venv .venv-audit
          .venv-audit/bin/python -m pip install --upgrade pip
          .venv-audit/bin/pip install -e .
          # Keep build tooling at advisory-free versions before auditing.
          .venv-audit/bin/pip install --upgrade setuptools
          .venv-audit/bin/pip install pip-audit
      - name: Audit runtime dependency closure
        run: .venv-audit/bin/pip-audit --skip-editable --progress-spinner off

  contract:
    name: Plugin API contract
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
      QT_QPA_PLATFORM: offscreen
      # Release pinning: point `ref:` below at an explicit plugins commit or
      # tag before cutting a release, and advance it intentionally afterwards.
      # The default follows the registry's main branch during development.
      HPC_GUI_CONTRACT_REPO: ${{ github.workspace }}/hpc-client-gui-plugins
    steps:
      - uses: actions/checkout@v4
      - name: Check out the official plugin registry (sibling directory)
        uses: actions/checkout@v4
        with:
          repository: mskomek/hpc-client-gui-plugins
          # Release pin: currently pinned to the registry hardening branch.
          # Advance this intentionally: once PR mskomek/hpc-client-gui-plugins#1
          # is merged, point this back at `main` (or an explicit tag/commit).
          ref: feat/registry-validation-fluent-metadata
          path: hpc-client-gui-plugins
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        # The contract suite is deliberately lightweight: it exercises the
        # plugin stack without importing Qt, so no GUI dependencies install.
        run: |
          python -m pip install --upgrade pip
          pip install pytest packaging jsonschema
      - name: Cross-repository plugin contract tests
        run: >
          python -m pytest tests/test_plugin_contract.py -q --tb=short -rf

  gui:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Qt runtime
        run: sudo apt-get update && sudo apt-get install --yes libegl1
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -e .[test]
          pip install pytest pytest-cov
      - name: GUI and offline test suite (report-only coverage)
        run: >
          python -m pytest tests/ -q --tb=short -rf
          --cov=hpc_gui --cov-report=term --cov-report=json:coverage.json
          --cov-fail-under=0
