name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: src
  QT_QPA_PLATFORM: offscreen
  HPC_GUI_DISABLE_WEBENGINE: "1"

jobs:
  quality:
    name: Quality (Python 3.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install Qt runtime
        run: sudo apt-get update && sudo apt-get install --yes libegl1
      - name: Install development dependencies
        run: python -m pip install --requirement requirements-dev.txt
      - name: Run all local pre-push checks
        run: python scripts/ci.py pre-push
      - name: Upload coverage reports
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-${{ github.run_id }}
          if-no-files-found: ignore
          path: |
            coverage.json
            coverage.xml

  compatibility:
    name: Compatibility (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Qt runtime
        run: sudo apt-get update && sudo apt-get install --yes libegl1
      - name: Install development dependencies
        run: python -m pip install --requirement requirements-dev.txt
      - name: Run compatibility checks
        run: python scripts/ci.py compat

  macos:
    name: macOS (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: arm64
          - os: macos-15-intel
            arch: x86_64
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install development dependencies
        run: python -m pip install --requirement requirements-dev.txt
      - name: Run macOS checks
        run: python scripts/ci.py macos

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install development dependencies
        shell: pwsh
        run: python -m pip install --requirement requirements-dev.txt
      - name: Run Windows checks
        shell: pwsh
        run: python scripts/ci.py windows

  contract:
    name: Plugin API contract
    runs-on: ubuntu-latest
    env:
      HPC_GUI_CONTRACT_REPO: ${{ github.workspace }}/hpc-client-gui-plugins
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check out official plugin registry
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: mskomek/hpc-client-gui-plugins
          # Release pin: explicit registry tag. Advance intentionally
          # (see PRODUCTION_CHECKLIST.md §11).
          ref: b5c22aa4357c4ae6cdf8e65a32b5c47cbd7b7a74
          path: hpc-client-gui-plugins
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install contract dependencies
        run: python -m pip install pytest packaging jsonschema
      - name: Run contract checks
        run: python scripts/ci.py contract
