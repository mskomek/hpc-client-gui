name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  cli:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Qt runtime
        run: sudo apt-get update && sudo apt-get install --yes libegl1
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -e .[test]
          pip install pytest
      - name: Compile check
        run: python -m compileall src/hpc_gui
      - name: i18n drift gate
        run: python scripts/check_i18n.py
      - name: Smoke test
        run: python scripts/smoke_test.py
      - name: CLI test suite
        run: python -m pytest tests/test_cli.py tests/test_cli_entrypoint.py -q --tb=short -rf


  ssh_sftp:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Qt runtime
        run: sudo apt-get update && sudo apt-get install --yes libegl1
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -e .[test]
          pip install pytest
      - name: SSH and SFTP test suite
        run: python -m pytest tests/test_optional_ssh_credentials.py tests/test_slurm_ssh.py tests/test_local_transfer_gate.py tests/test_transfer_wave17.py tests/test_transfer_controller.py tests/test_profile_transfer_settings.py -q --tb=short -rf

  windows:
    runs-on: windows-latest
    env:
      PYTHONPATH: src
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -e .[test]
          pip install pytest
      - name: Windows boundary tests
        run: python -m pytest tests/test_safe_download.py tests/test_version_consistency.py tests/test_startup_changelog.py -q --tb=short
  gui:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Qt runtime
        run: sudo apt-get update && sudo apt-get install --yes libegl1
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -e .[test]
          pip install pytest
      - name: GUI and offline test suite
        run: python -m pytest tests/ -q --tb=short -rf