name: V2 source CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop, codex/wx-native-close-integrated-20261121]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v2-source-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

# This workflow deliberately restores the missing continuous source gate.
# It is NOT the full GUI/LOCAL_REAL/packaged V2 acceptance matrix.
# The manual release workflow remains separate and is not triggered here.
jobs:
  architecture:
    name: Source architecture gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
      - name: Install architecture test runner
        run: python -m pip install "pytest>=7"
      - name: Architecture and Qt removal gate regression tests
        run: python -m pytest tests/test_source_architecture_gate.py tests/test_qt_removal_gate.py -q
      - name: Enforce global source size, dependencies, cycles and public APIs
        run: >-
          python scripts/check_source_architecture.py
          --mode full
      - name: Add architecture report
        if: always()
        run: |
          if [ -f .tmp/source-architecture.md ]; then
            cat .tmp/source-architecture.md >> "$GITHUB_STEP_SUMMARY"
          fi

  source-quality:
    name: Source quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
      - name: Install pinned lint engine
        run: python -m pip install "ruff==0.16.8"
      - name: Compile production, scripts and tests
        run: python -m compileall -q src/hpc_gui scripts tests
      - name: Ruff correctness gate
        run: python -m ruff check src scripts tests
      - name: i18n drift gate
        run: python scripts/check_i18n.py

  portable-contracts:
    name: Portable wx contract tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONPATH: src
      HPC_GUI_DISABLE_WEBENGINE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
      - name: Install wx test dependencies (Windows)
        if: runner.os == 'Windows'
        run: python -m pip install -e ".[test]"
      - name: Install headless contract dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          python -m pip install pytest packaging paramiko cryptography keyring pyftpdlib
          python -m pip install --no-deps -e .
      - name: Portable path, plugin and shutdown contracts
        run: >-
          python -m pytest
          tests/test_wx_packaged_smoke.py::test_workdir_outside_repo_excludes_repo_tmp
          tests/test_hardening_additional.py::test_wx_dispatch_uses_host
          tests/test_wx_smoke_shutdown_contract.py
          tests/test_wx_terminal_url_bridge.py
          tests/test_job_paths.py
          tests/test_job_rows.py
          tests/test_job_security.py
          tests/test_job_provenance.py
          tests/test_job_record_store.py
          tests/test_jobs_workspace_controllers.py
          tests/test_jobs_completed_fallback.py
          tests/test_jobs_history.py
          tests/test_selected_job_context.py
          tests/test_wx_terminal_webview_factory.py
          tests/test_wx_packaged_terminal_activation.py
          tests/test_wx_terminal_mount_order.py
          tests/test_wx_terminal_diagnostic.py
          tests/test_cli_profile_refactor_contracts.py
          tests/test_wx_shell_teardown_contracts.py
          tests/test_wx_application_native_exit_policy.py
          tests/test_wx_shortcut_preferences.py
          tests/test_wx_shell_sizing.py
          tests/test_wx_clipboard.py
          tests/test_ssh_files_error_contracts.py
          tests/test_ssh_files_text_mixin.py
          tests/test_ssh_files_lstat.py
          tests/test_config_refactor_contracts.py
          tests/test_x11_server_discovery.py
          tests/test_x11_server_startup.py
          tests/test_x11_runner_subprocess.py
          tests/test_terminal_bridge.py
          tests/test_ui_errors.py
          tests/test_shared_ui_contracts.py
          tests/test_startup_i18n.py
          tests/test_startup_changelog.py
          tests/test_retired_startup_boundary.py
          tests/test_startup_checks.py
          tests/test_startup_update_state.py
          tests/test_wx_startup_notices.py::test_startup_notices_persist_version_and_welcome_choice
          tests/test_wx_startup_notices.py::test_failed_changelog_does_not_mark_version_seen
          tests/test_performance_probe.py::PerformanceProbeTests::test_slow_event_loop_tick_is_recorded
          tests/test_performance_probe.py::PerformanceProbeTests::test_fast_event_loop_tick_does_not_write_delay
          tests/test_macos_product_surface.py::test_application_identity_uses_product_name
          tests/test_linux_x11.py
          tests/test_macos_x11.py
          tests/test_wx_webview_native_retry.py
          tests/test_wx_terminal_native_teardown_contracts.py
          -q --tb=short
      - name: Original close ownership contract (Windows wxPython)
        if: runner.os == 'Windows'
        run: >-
          python -m pytest
          tests/test_wx_terminal_webview_bridge.py::test_wx_terminal_close_releases_native_webview
          -q --tb=short

      - name: Transfer concurrency and resource isolation (no Qt dependency)
        run: >-
          python -m pytest
          tests/test_transfer_concurrency.py
          tests/test_transfer_controller.py
          tests/test_transfer_cancel_recovery.py
          tests/test_transfer_queue_priority.py
          -q --tb=short
      - name: Native wx transfer limit parity (Windows)
        if: runner.os == 'Windows'
        run: >-
          python -m pytest tests/test_wx_transfer_parallel_hint.py -q --tb=short

      - name: Native wx cancel and retry recovery (Windows)
        if: runner.os == 'Windows'
        run: >-
          python -m pytest tests/test_wx_transfer_cancel_recovery_native.py tests/test_wx_transfer_queue_menu_native.py -q --tb=short
      - name: Headless updater and diagnostic regressions
        run: >-
          python -m pytest
          tests/test_updater_helper.py
          tests/test_linux_update_handoff.py
          tests/test_debug_support_runtime.py
          tests/test_crash_logging_filter.py
          tests/test_wx_crash_reporting_runtime.py::test_headless_exception_hook_persists_without_gui_imports
          -q --tb=short
      - name: Native wx structural telemetry and connection diagnostics (Windows)
        if: runner.os == 'Windows'
        run: >-
          python -m pytest
          tests/test_wx_debug_telemetry_native.py
          tests/test_debug_telemetry.py
          tests/test_w15_fresh_user_startup.py::test_closed_port_connect_fails_visibly_without_connected_state
          -q --tb=short
      - name: Native wx startup flow and callback lifetime (Windows)
        if: runner.os == 'Windows'
        run: >-
          python -m pytest tests/test_wx_startup_flow_native.py -q --tb=short
      - name: Native wx startup notices (Windows)
        if: runner.os == 'Windows'
        run: >-
          python -m pytest tests/test_wx_startup_notices.py::test_native_startup_dialogs_are_read_only_and_opt_out_is_persisted -q --tb=short
      - name: Native wx quick tour and product icon (Windows)
        if: runner.os == 'Windows'
        run: >-
          python -m pytest tests/test_wx_tour_icon_native.py -q --tb=short
      - name: Native wx performance recorder (Windows)
        if: runner.os == 'Windows'
        run: >-
          python -m pytest tests/test_performance_probe.py::PerformanceProbeTests::test_wx_event_loop_block_is_detected -q --tb=short
      - name: Native wx crash diagnostics (Windows)
        if: runner.os == 'Windows'
        run: >-
          python -m pytest tests/test_wx_crash_reporting_runtime.py::test_wx_previous_and_live_crash_diagnostics -q --tb=short
      - name: Native wx independent updater helper (Windows)
        if: runner.os == 'Windows'
        run: python -m pytest tests/test_wx_updater_helper_native.py -q --tb=short

  qt-removal-readiness:
    name: Strict Qt removal readiness (stacked migration)
    if: github.event_name == 'pull_request' && github.base_ref == 'codex/wx-native-close-integrated-20261121'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact migration HEAD
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
      - name: Execute full tracked production Qt removal gate
        run: python scripts/qt_removal_gate.py --output .tmp/qt-removal-gate.json
      - name: Preserve gate evidence even on NO-GO
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: qt-removal-gate
          path: .tmp/qt-removal-gate.json
          if-no-files-found: error
