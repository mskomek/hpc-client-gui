name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    env:
      PYTHONPATH: src
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Compile check
        run: python -m compileall src/truba_gui
      - name: i18n drift gate
        run: python scripts/check_i18n.py
      - name: Smoke test
        run: python scripts/smoke_test.py
      - name: Offline test suite
        run: python -m pytest tests/ -q --tb=short -rf --ignore=tests/test_runner_ollama.py
