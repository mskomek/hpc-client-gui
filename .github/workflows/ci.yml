name: V2 source CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v2-source-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

# This workflow deliberately restores the missing continuous source gate.
# It is NOT the full GUI/LOCAL_REAL/packaged V2 acceptance matrix.
# The manual release workflow remains separate and is not triggered here.
jobs:
  architecture:
    name: Source architecture gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
      - name: Install architecture test runner
        run: python -m pip install "pytest>=7"
      - name: Architecture gate regression tests
        run: python -m pytest tests/test_source_architecture_gate.py -q
      - name: Enforce global source size, dependencies, cycles and public APIs
        run: >-
          python scripts/check_source_architecture.py
          --mode full
      - name: Add architecture report
        if: always()
        run: |
          if [ -f .tmp/source-architecture.md ]; then
            cat .tmp/source-architecture.md >> "$GITHUB_STEP_SUMMARY"
          fi

  source-quality:
    name: Source quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
      - name: Install pinned lint engine
        run: python -m pip install "ruff==0.16.8"
      - name: Compile production, scripts and tests
        run: python -m compileall -q src/hpc_gui scripts tests
      - name: Ruff correctness gate
        run: python -m ruff check src scripts tests
      - name: i18n drift gate
        run: python scripts/check_i18n.py

  portable-contracts:
    name: Portable wx contract tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONPATH: src
      HPC_GUI_DISABLE_WEBENGINE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
      - name: Install wx test dependencies (Windows)
        if: runner.os == 'Windows'
        run: python -m pip install -e ".[test]"
      - name: Install headless contract dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          python -m pip install pytest packaging paramiko cryptography keyring pyftpdlib
          python -m pip install --no-deps -e .
      - name: Portable path, plugin and shutdown contracts
        run: >-
          python -m pytest
          tests/test_wx_packaged_smoke.py::test_workdir_outside_repo_excludes_repo_tmp
          tests/test_hardening_additional.py::test_wx_dispatch_uses_host
          tests/test_wx_smoke_shutdown_contract.py
          tests/test_wx_terminal_url_bridge.py
          tests/test_job_paths.py
          tests/test_job_rows.py
          tests/test_job_security.py
          tests/test_job_provenance.py
          tests/test_job_record_store.py
          tests/test_jobs_workspace_controllers.py
          tests/test_jobs_completed_fallback.py
          tests/test_jobs_history.py
          tests/test_selected_job_context.py
          tests/test_wx_terminal_webview_factory.py
          tests/test_wx_packaged_terminal_activation.py
          tests/test_wx_terminal_mount_order.py
          tests/test_x11_server_discovery.py
          tests/test_x11_server_startup.py
          tests/test_wx_webview_native_retry.py
          -q --tb=short
